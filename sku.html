<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
<script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css " rel="stylesheet">
    <title>Project</title>
    <style>

        body{
            background-image: url('https://i.pinimg.com/736x/39/8d/73/398d732701eb854945885d25dc426d3c.jpg');
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif ;
            color: rgb(66, 43, 2);
        }
        #sku{
             background-color: chocolate;
            width: 330px;
            height: 400px;
            margin-top: 39px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:  rgba(176, 97, 0, 0.746);">

        <div class="container-fluid">

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
             <span class="navbar-toggler-icon"></span>
            </button>

           <div class="collapse navbar-collapse" id="mynavbar">

                <ul class="navbar-nav gap-4" style="margin-left: 800px; margin-top: 1px;">

                 <li class="nav-item"><a class="nav-link" href="index.html" style="color: rgb(255, 220, 175);">Receipt Generator</a></li>

                 <li class="nav-item"><a class="nav-link" href="sku.html" style="color: rgb(255, 220, 175);">SKU Generator</a></li>
                </ul>

            </div>
        </div>
    </nav> 
    <center>
    <div id="sku">

        <br>
        <h1>SKU Generator</h1>

<form>

    <h5>Categories</h5>
     <select id="category">
        <option value="0">Select an option</option>
        <option id="Breads">Breads</option>
        <option id="Pastries">Pastries</option>
    </select>
</form>

    <h5>Products</h5>
    <input type="text" id="products" placeholder="Type your chosen product"><br>
    <h5>Quantity</h5>
    <input type="text" id="stock" placeholder="Input the stock quantity"><br><br>
    <button type="button" py-click="sku_generator" value="Generate" class="btn btn-warning">Generate</button>
    <input type="button" onclick="window.location.reload()" value="Cancel" class="btn btn-warning">

    <h6>Generated SKU:</h6>
    <div id="results">
        <py-script src="sku.py"></py-script>
    </div>

    </div>

    <br>
</center>
</body>
</html>
